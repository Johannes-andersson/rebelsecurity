[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebel-security"
version = "1.0.0a0"
description = "Offline terminal password generation and security education toolkit"
requires-python = ">=3.12"
dependencies = ["textual>=6.12,<7", "rich>=14,<15", "zxcvbn>=4.5,<5", "pyperclip>=1.9,<2", "bcrypt>=5,<6", "argon2-cffi>=25.1,<26"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
rebel-security = "rebel_security.app:main"

[tool.setuptools.packages.find]
include = ["rebel_security*"]

[tool.setuptools.package-data]
rebel_security = ["data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
